<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Barnak Roy Nandy: computer vision and applied ML">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#00ff41" fill-opacity=".12"/></pattern>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00ff41" fill-opacity=".04"/></pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff41" stop-opacity="0"/><stop offset="1" stop-color="#00ff41" stop-opacity=".16"/></linearGradient>
    <radialGradient id="shade" cx=".24" cy=".5" r=".55"><stop offset="0" stop-color="#000" stop-opacity=".88"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .m { font-family: "JetBrains Mono", "Cascadia Mono", Consolas, "Courier New", monospace; }
      .d { font-family: "Chakra Petch", "Bahnschrift", "Arial Narrow", "Segoe UI", Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="#000"/>
  <rect width="1200" height="360" fill="url(#dots)"/>

  <!-- detections: green = accepted, red dashed = rejected -->
  <g class="m" font-size="12" font-weight="700" filter="url(#glow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 14 6; 0 0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="9s" repeatCount="indefinite"/>
      <rect x="700" y="60" width="170" height="120" fill="none" stroke="#00ff41" stroke-width="1.5"/>
      <rect x="699" y="42" width="92" height="18" fill="#00ff41"/><text x="704" y="55" fill="#000">deer 0.94</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -12 8; 0 0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.15;.8;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      <rect x="930" y="40" width="200" height="140" fill="none" stroke="#ff3b3b" stroke-width="1.5" stroke-dasharray="6 4"/>
      <rect x="929" y="22" width="124" height="18" fill="#ff3b3b"/><text x="934" y="35" fill="#000">✕ lynx 0.61</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 10 -8; 0 0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="8s" begin="3s" repeatCount="indefinite"/>
      <rect x="820" y="210" width="150" height="90" fill="none" stroke="#00ff41" stroke-width="1.5"/>
      <rect x="819" y="192" width="100" height="18" fill="#00ff41"/><text x="824" y="205" fill="#000">hand_R 0.96</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -10 -6; 0 0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.12;.8;1" dur="10s" begin=".8s" repeatCount="indefinite"/>
      <rect x="1010" y="200" width="140" height="100" fill="none" stroke="#ff3b3b" stroke-width="1.5" stroke-dasharray="6 4"/>
      <rect x="1009" y="182" width="132" height="18" fill="#ff3b3b"/><text x="1014" y="195" fill="#000">✕ unknown 0.42</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;.7;.7;0" keyTimes="0;.15;.8;1" dur="6s" begin="2.2s" repeatCount="indefinite"/>
      <rect x="640" y="230" width="110" height="70" fill="none" stroke="#ff3b3b" stroke-width="1.5" stroke-dasharray="6 4"/>
      <rect x="639" y="212" width="108" height="18" fill="#ff3b3b"/><text x="644" y="225" fill="#000">✕ boar 0.55</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;.8;.8;0" keyTimes="0;.15;.8;1" dur="7.5s" begin="4.2s" repeatCount="indefinite"/>
      <rect x="560" y="40" width="100" height="70" fill="none" stroke="#00ff41" stroke-width="1.5"/>
      <rect x="559" y="22" width="84" height="18" fill="#00ff41"/><text x="564" y="35" fill="#000">owl 0.89</text>
    </g>
  </g>

  <!-- scan line -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -80; 0 380" dur="6s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="1200" height="70" fill="url(#sweep)"/>
    <rect x="0" y="70" width="1200" height="1" fill="#00ff41" fill-opacity=".7" filter="url(#glow)"/>
  </g>

  <rect width="1200" height="360" fill="url(#shade)"/>
  <rect width="1200" height="360" fill="url(#scan)"/>

  <!-- prompt -->
  <text x="60" y="62" class="m" font-size="15" fill="#74a07c"><tspan fill="#00ff41">~</tspan> $ whoami<tspan fill="#00ff41">▌<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- the name, detected -->
  <g>
    <rect x="60" y="104" width="560" height="170" fill="#000" fill-opacity=".65" stroke="#00ff41" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="55" y="99" width="10" height="10" fill="#00ff41"/><rect x="615" y="99" width="10" height="10" fill="#00ff41"/>
    <rect x="55" y="269" width="10" height="10" fill="#00ff41"/><rect x="615" y="269" width="10" height="10" fill="#00ff41"/>
    <rect x="59" y="80" width="276" height="24" fill="#00ff41"/>
    <text x="68" y="97" class="m" font-size="13" font-weight="700" fill="#000">person · barnak_roy_nandy · 0.99</text>
    <text x="84" y="180" class="d" font-size="72" fill="#e4ffe8" textLength="300" lengthAdjust="spacingAndGlyphs">BARNAK</text>
    <text x="84" y="252" class="d" font-size="72" fill="none" stroke="#00ff41" stroke-width="1.6" textLength="150" lengthAdjust="spacingAndGlyphs" filter="url(#glow)">ROY</text>
    <text x="256" y="252" class="d" font-size="72" fill="#e4ffe8" textLength="260" lengthAdjust="spacingAndGlyphs">NANDY</text>
  </g>

  <!-- HUD -->
  <rect x="0" y="320" width="1200" height="40" fill="#000" fill-opacity=".85"/>
  <rect x="0" y="320" width="1200" height="1" fill="#123018"/>
  <text x="60" y="345" class="m" font-size="13" fill="#74a07c">computer vision · applied ml · full-stack   <tspan fill="#00ff41">● running</tspan>   accepted <tspan fill="#00ff41">3</tspan>   rejected <tspan fill="#ff3b3b">3</tspan></text>
  <text x="1140" y="345" class="m" font-size="13" fill="#74a07c" text-anchor="end">infer.py · yolov8x → efficientnet-b4 · thr 0.85</text>
</svg>
